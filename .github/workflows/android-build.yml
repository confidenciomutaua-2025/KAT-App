name: Android CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Configurar Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Configurar cache Gradle
      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3

      # Restaurar o keystore a partir do secret Base64
      - name: Decode keystore
        run: |
          mkdir -p keystore
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore/kat.jks

      # Construir APK
      - name: Build APK
        run: ./gradlew assembleRelease

      # Fazer upload do APK como artefato
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KAT-APK
          path: app/build/outputs/apk/release/app-release.apk
